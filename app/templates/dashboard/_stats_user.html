{# 用户个人统计卡片片段 - 供 HTMX 局部刷新 #}
<div class="col-md-3">
    <div class="card text-center border-primary">
        <div class="card-body py-3">
            <i class="bi bi-flask fs-4 text-primary"></i>
            <h3 class="mt-1">{{ data.user_stats.experiment_count }}</h3>
            <small class="text-muted">我的实验</small>
        </div>
    </div>
</div>
<div class="col-md-3">
    <div class="card text-center border-warning">
        <div class="card-body py-3">
            <i class="bi bi-radar fs-4 text-warning"></i>
            <h3 class="mt-1">{{ data.user_stats.scan_count }}</h3>
            <small class="text-muted">扫描任务</small>
        </div>
    </div>
</div>
<div class="col-md-3">
    <div class="card text-center border-info">
        <div class="card-body py-3">
            <i class="bi bi-robot fs-4 text-info"></i>
            <h3 class="mt-1">{{ data.user_stats.ai_count }}</h3>
            <small class="text-muted">AI分析</small>
        </div>
    </div>
</div>
<div class="col-md-3">
    <div class="card text-center border-success">
        <div class="card-body py-3">
            <i class="bi bi-file-earmark-pdf fs-4 text-success"></i>
            <h3 class="mt-1">{{ data.user_stats.report_count }}</h3>
            <small class="text-muted">实验报告</small>
        </div>
    </div>
</div>
