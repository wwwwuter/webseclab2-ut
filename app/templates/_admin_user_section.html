{# 用户管理 section — 供统一 /admin 页 (embed=true) 与原 admin 页 include 共用 #}
<div class="card shadow-sm mb-4">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <span><i class="bi bi-people"></i> 用户管理</span>
        <span class="badge bg-light text-dark">{{ pagination.total }} 位用户</span>
    </div>
    <div class="card-body">
        <!-- 搜索 / 角色筛选 -->
        <form method="GET" action="{{ url_for('main.admin_panel') }}"
              hx-get="{{ url_for('main.admin_panel') }}"
              hx-target="#admin-user-results" hx-swap="innerHTML"
              hx-push-url="{{ 'false' if embed else 'true' }}"
              class="row g-2 mb-3">
            <div class="col-12 col-md-6">
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" name="q" value="{{ keyword }}" class="form-control"
                           placeholder="搜索用户名或邮箱...">
                </div>
            </div>
            <div class="col-8 col-md-4">
                <select name="role" class="form-select">
                    <option value="">全部角色</option>
                    <option value="admin" {% if role == 'admin' %}selected{% endif %}>管理员</option>
                    <option value="user" {% if role == 'user' %}selected{% endif %}>普通用户</option>
                </select>
            </div>
            <div class="col-4 col-md-2 d-grid">
                <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> 筛选</button>
            </div>
            <input type="hidden" name="sort" value="{{ sort_by }}">
            <input type="hidden" name="order" value="{{ order }}">
        </form>

        <div id="admin-user-results">
            {% include '_admin_user_list.html' %}
        </div>
    </div>
</div>
